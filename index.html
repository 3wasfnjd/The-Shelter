<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b211e">
  <title>THE SHELTER — BUNKER 17</title>
</head>
<body>
  <canvas id="game" aria-label="غرفة تحكم الملجأ 17"></canvas>
  <header id="hud" hidden><span lang="en">THE SHELTER <small>BUNKER 17</small></span><p id="stage"></p></header>
  <section id="loading" class="overlay" aria-live="polite">
    <small>THE SHELTER</small><h1>LOADING BUNKER 17</h1>
    <progress id="progress" max="1" value="0"></progress><p id="loading-status">جارٍ فحص أصول الغرفة…</p>
    <ul id="missing"></ul><button id="start" hidden>دخول غرفة التحكم</button>
    <button id="preview-assets" hidden>معاينة الغرفة والشخصية</button>
  </section>
  <p id="notice" role="status" aria-live="polite"></p>
  <button id="back-preview" hidden style="position:fixed;left:16px;top:16px">العودة</button>
  <nav id="modes" hidden aria-label="أوضاع العرض"><button id="vr" disabled>VR</button><button id="ar" disabled>AR</button><button id="mute" aria-pressed="false">الصوت</button></nav>
  <section id="controls" hidden>
    <div id="joystick" role="group" aria-label="عصا الحركة"><span id="stick"></span></div>
    <button id="interact" disabled>تفاعل</button>
    <button id="room-view" aria-pressed="false">عرض الغرفة كاملة</button>
    <button id="focus" disabled>تكبير الجهاز</button>
    <p id="help">WASD / الأسهم: حركة · E: تفاعل · انقر لاختيار جهاز · اسحب لتدوير الكاميرا</p>
  </section>
  <section id="ending" hidden aria-labelledby="ending-title">
    <img id="ending-image" alt="الناجي من الخلف أمام وادٍ أخضر ونهر وغروب ذهبي بعد الخروج من الملجأ" decoding="async">
    <div class="ending-copy">
      <small lang="en">THE SHELTER — ESCAPED</small>
      <h1 id="ending-title" tabindex="-1">نجوت… والحرية أمامك</h1>
      <p>خلفك أبواب الملجأ. أمامك حياة جديدة.</p>
      <div class="ending-actions"><button id="ending-replay">العب من جديد</button><button id="ending-mute" aria-pressed="false">الصوت</button></div>
    </div>
  </section>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
